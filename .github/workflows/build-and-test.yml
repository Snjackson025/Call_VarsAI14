name: Build and Test Call_VarsAI14

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: Build project (Debug x64)
      run: |
        msbuild Call_VarsAI14.sln /p:Configuration=Debug /p:Platform=x64
    
    - name: Build project (Release x64)
      run: |
        msbuild Call_VarsAI14.sln /p:Configuration=Release /p:Platform=x64
    
    - name: Upload build artifacts (Debug)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-Debug-x64
        path: x64/Debug/
    
    - name: Upload build artifacts (Release)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-Release-x64
        path: x64/Release/

  test:
    runs-on: windows-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: Build in Debug mode
      run: msbuild Call_VarsAI14.sln /p:Configuration=Debug /p:Platform=x64
    
    - name: Run application
      run: |
        if (Test-Path "x64/Debug/Call_VarsAI14.exe") {
          .\x64\Debug\Call_VarsAI14.exe
        } else {
          echo "Executable not found at x64/Debug/Call_VarsAI14.exe"
          dir x64/
        }
      continue-on-error: true
    
    - name: Report test results
      if: always()
      run: |
        echo "Build and test workflow completed"
